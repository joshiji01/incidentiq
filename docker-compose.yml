services:

  postgres:
    image: pgvector/pgvector:pg16

    container_name: incidentiq-postgres

    environment:
      POSTGRES_DB: incidentiq
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: incidentiq

    ports:
      - "5433:5432"

    volumes:
      - incidentiq-postgres-data:/var/lib/postgresql/data

volumes:
  incidentiq-postgres-data: